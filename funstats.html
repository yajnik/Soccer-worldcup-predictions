<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fun Stats · World Cup 26</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--green:#1a4d2e;--green-mid:#245c38;--gold:#c9a84c;--gold-lt:#e8c97a;--cream:#faf6ed;--white:#ffffff;--text:#1c1c1c;--muted:#7a7a7a;--border:rgba(201,168,76,0.18);--radius:16px;--shadow-md:0 8px 36px rgba(0,0,0,0.11);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}
    nav{background:var(--green);padding:0 20px;display:flex;align-items:center;gap:0;border-bottom:1px solid rgba(255,255,255,0.08);}
    .nav-logo{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--white);padding:14px 0;margin-right:24px;white-space:nowrap;}
    .nav-logo em{color:var(--gold);font-style:italic;}
    .nav-links{display:flex;gap:2px;flex:1;}
    .nav-link{display:inline-flex;align-items:center;gap:6px;padding:14px 16px;font-size:0.83rem;font-weight:600;color:rgba(255,255,255,0.55);text-decoration:none;border-bottom:3px solid transparent;transition:color .2s,border-color .2s;white-space:nowrap;}
    .nav-link:hover{color:rgba(255,255,255,0.85);}
    .nav-link.active{color:var(--white);border-bottom-color:var(--gold);}
    .nav-auth{margin-left:auto;display:flex;align-items:center;gap:10px;}
    .nav-user{font-size:0.78rem;color:rgba(255,255,255,0.55);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    header{background:var(--green);padding:16px 24px 14px;text-align:center;position:relative;overflow:hidden;}
    header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 15% 60%,rgba(201,168,76,.15) 0%,transparent 55%),radial-gradient(ellipse at 85% 25%,rgba(201,168,76,.1) 0%,transparent 50%);pointer-events:none;}
    .header-inner{position:relative;z-index:1;}
    .badge{display:inline-block;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.4);color:var(--gold-lt);font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:50px;margin-bottom:6px;}
    header h1{font-family:'Playfair Display',serif;font-size:clamp(1.25rem,4vw,1.8rem);font-weight:900;color:var(--white);line-height:1.1;margin-bottom:4px;}
    header h1 em{color:var(--gold);font-style:italic;}
    main{max-width:1060px;margin:0 auto;padding:24px 16px 90px;}
    .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
    .sec-head .pip{width:8px;height:8px;background:var(--gold);border-radius:50%;flex-shrink:0;}
    .sec-head h2{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;color:var(--green);}
    .sec-head .rule{flex:1;height:1px;background:linear-gradient(to right,rgba(201,168,76,.35),transparent);}
    .spinner-wrap{padding:60px 20px;text-align:center;}
    .spinner{width:32px;height:32px;border:3px solid rgba(26,77,46,.1);border-top-color:var(--green);border-radius:50%;animation:spin .85s linear infinite;margin:0 auto 14px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .spinner-wrap p{font-size:.85rem;color:var(--muted);}
    /* STAT CARDS */
    .stats-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-bottom:48px;}
    .stat-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-md);padding:22px 24px;display:flex;flex-direction:column;gap:10px;transition:transform .18s,box-shadow .18s;}
    .stat-card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.13);}
    .stat-card-label{font-size:.72rem;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);}
    .stat-card-players{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--green);line-height:1.25;}
    .stat-card-value{font-size:2rem;font-weight:900;font-family:'Playfair Display',serif;color:var(--gold);line-height:1;}
    .stat-card-footer{height:3px;border-radius:2px;background:linear-gradient(to right,var(--gold),transparent);margin-top:4px;}
    .stat-card-table{width:100%;border-collapse:collapse;font-size:.8rem;margin:2px 0;}
    .stat-card-table th{text-align:left;color:var(--muted);font-weight:600;font-size:.66rem;letter-spacing:.8px;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--border);}
    .stat-card-table td{padding:5px 6px;color:var(--text);border-bottom:1px solid rgba(201,168,76,.07);}
    .stat-card-table tr:last-child td{border-bottom:none;}
    .stat-card-table td:first-child{font-weight:600;color:var(--green);}
    .stat-card-narrative{font-size:.8rem;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);padding-top:10px;margin-top:2px;font-style:italic;}
    /* COMING SOON */
    .coming-soon{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-md);padding:52px 24px;text-align:center;}
    .coming-soon .cs-icon{font-size:3rem;margin-bottom:14px;}
    .coming-soon h3{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--green);margin-bottom:8px;}
    .coming-soon p{font-size:.87rem;color:var(--muted);max-width:340px;margin:0 auto;line-height:1.6;}
    .coming-badge{display:inline-block;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-size:.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 12px;border-radius:50px;margin-top:14px;}
    footer{text-align:center;padding:24px 20px;background:var(--green);color:rgba(255,255,255,.35);font-size:.75rem;letter-spacing:.3px;}
    footer span{color:var(--gold);}
    .reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease;}
    .reveal.vis{opacity:1;transform:none;}
    /* MOBILE */
    .mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--green);border-top:1px solid rgba(255,255,255,.1);z-index:100;padding-bottom:env(safe-area-inset-bottom,0);}
    .mobile-nav-inner{display:flex;align-items:stretch;}
    .mob-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 8px;text-decoration:none;color:rgba(255,255,255,.45);font-size:.58rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;gap:3px;border-top:3px solid transparent;transition:color .2s,border-color .2s;}
    .mob-tab .ti{font-size:1.15rem;line-height:1;}
    .mob-tab.active{color:var(--gold-lt);border-top-color:var(--gold);}
    @media(max-width:600px){
      .mobile-nav{display:block;}
      main{padding-bottom:90px!important;}
      nav .nav-links{display:none;}
      .stats-cards-grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">⚽ World Cup <em>26</em></div>
  <div class="nav-links">
    <a class="nav-link" href="index.html">🏆 Leaderboard</a>
    <a class="nav-link" href="predict.html">✏️ Predict</a>
    <a class="nav-link" href="my-predictions.html">👤 My Predictions</a>
    <a class="nav-link active" href="funstats.html">📊 Fun Stats</a>
  </div>
  <div class="nav-auth">
    <span class="nav-user" id="nav-user-email" style="display:none"></span>
  </div>
</nav>

<header>
  <div class="header-inner">
    <div class="badge">⚽ FIFA World Cup 2026</div>
    <h1>Fun <em>Stats</em></h1>
  </div>
</header>

<main>
  <div class="sec-head reveal">
    <div class="pip"></div>
    <h2>Who's the Oracle? Who's the Optimist?</h2>
    <div class="rule"></div>
  </div>

  <div id="stats-loading" class="spinner-wrap">
    <div class="spinner"></div>
    <p>Loading stats…</p>
  </div>

  <div id="stats-grid"></div>
</main>

<footer>
  World Cup Predictions &nbsp;·&nbsp; <span>FIFA 2026</span> &nbsp;·&nbsp; Predictions close before kick-off
</footer>

<div class="mobile-nav">
  <div class="mobile-nav-inner">
    <a class="mob-tab" href="index.html"><span class="ti">🏆</span>Leaderboard</a>
    <a class="mob-tab" href="predict.html"><span class="ti">✏️</span>Predict</a>
    <a class="mob-tab" href="my-predictions.html"><span class="ti">👤</span>My Picks</a>
    <a class="mob-tab active" href="funstats.html"><span class="ti">📊</span>Fun Stats</a>
  </div>
</div>

<script>
async function loadStats() {
  const loadingEl = document.getElementById('stats-loading');
  const gridEl    = document.getElementById('stats-grid');
  try {
    const res = await fetch('soccer-funstats.html?nocache=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    if (!html || html.trim().length < 10) throw new Error('Empty');
    loadingEl.style.display = 'none';
    gridEl.innerHTML = html;
  } catch(e) {
    loadingEl.style.display = 'none';
    gridEl.innerHTML = `
      <div class="coming-soon">
        <div class="cs-icon">📈</div>
        <h3>Stats Coming Soon</h3>
        <p>Fun stats will appear here once matches are underway. Check back after the first few games!</p>
        <span class="coming-badge">Activates mid-tournament</span>
      </div>`;
  }
}

const storedEmail = localStorage.getItem('wc_user_email');
if (storedEmail) {
  const el = document.getElementById('nav-user-email');
  if (el) { el.textContent = storedEmail; el.style.display = 'block'; }
}

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('vis'); observer.unobserve(e.target); }});
}, { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

loadStats();
</script>
</body>
</html>
